[package]
name = "nodaysidle-ocr-agent"
version = "0.2.0"
edition = "2021"
authors = ["nodaysidle <team@nodaysidle.org>"]
description = "Fast Wayland Screen-Region OCR and Code Context Injector for AI coding agents and Herdr"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time"] }
serde_json = "1.0"
colored = "2.1"
